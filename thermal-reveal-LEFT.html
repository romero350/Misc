<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermal Reveal — Left Page</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
  }

  #page {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Image is scaled to fill the full HEIGHT, then anchored LEFT.
     This shows the left half of the landscape image on a portrait page. */
  #page img {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: auto;       /* preserves aspect ratio */
    max-width: none;   /* allows image to be wider than the container */
    display: block;
    z-index: 1;
  }

  #thermal-canvas {
    position: absolute;
    inset: 0;
    z-index: 2;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="page">

  <!-- Same image file used in both left and right HTML -->
  <img src="map.jpg" alt="Map">

  <canvas id="thermal-canvas"></canvas>
</div>
<script>
  const BRUSH_RADIUS   = 85;
  const RE_COVER_SPEED = 0.00008;

  const canvas = document.getElementById('thermal-canvas');
  const ctx    = canvas.getContext('2d');
  const page   = document.getElementById('page');

  let isActive = false;
  let mouseX = 0, mouseY = 0;
  let revealMap;

  function resize() {
    const rect = page.getBoundingClientRect();
    canvas.width  = rect.width;
    canvas.height = rect.height;
    revealMap = new Float32Array(canvas.width * canvas.height);
    drawOverlay();
  }

  function drawOverlay() {
    const imageData = ctx.createImageData(canvas.width, canvas.height);
    const d = imageData.data;
    for (let i = 0; i < revealMap.length; i++) {
      const alpha = Math.round((1 - revealMap[i]) * 245);
      d[i*4]     = 12;
      d[i*4 + 1] = 7;
      d[i*4 + 2] = 3;
      d[i*4 + 3] = alpha;
    }
    ctx.putImageData(imageData, 0, 0);
    if (isActive) drawWarmGlow();
  }

  function drawWarmGlow() {
    if (!isActive) return;
    const rect = page.getBoundingClientRect();
    const x = mouseX - rect.left;
    const y = mouseY - rect.top;
    ctx.save();
    ctx.globalCompositeOperation = 'source-atop';
    const grd = ctx.createRadialGradient(x, y, 0, x, y, BRUSH_RADIUS * 1.3);
    grd.addColorStop(0,   'rgba(200,100,20,.18)');
    grd.addColorStop(0.5, 'rgba(150,60,10,.08)');
    grd.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, BRUSH_RADIUS * 1.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function reveal(cx, cy) {
    const R = BRUSH_RADIUS, W = canvas.width, H = canvas.height;
    const x0 = Math.max(0, Math.floor(cx - R));
    const x1 = Math.min(W - 1, Math.ceil(cx + R));
    const y0 = Math.max(0, Math.floor(cy - R));
    const y1 = Math.min(H - 1, Math.ceil(cy + R));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx, dy = y - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < R) {
          const t = 1 - dist / R;
          const strength = t * t * (3 - 2*t);
          revealMap[y * W + x] = Math.min(1, revealMap[y * W + x] + strength * 0.18);
        }
      }
    }
    drawOverlay();
  }

  let lastRaf = 0;
  function coolDown(ts) {
    if (ts - lastRaf > 80) {
      lastRaf = ts;
      let changed = false;
      for (let i = 0; i < revealMap.length; i++) {
        if (revealMap[i] > 0) {
          revealMap[i] = Math.max(0, revealMap[i] - RE_COVER_SPEED * 80);
          changed = true;
        }
      }
      if (changed) drawOverlay();
    }
    requestAnimationFrame(coolDown);
  }
  requestAnimationFrame(coolDown);

  function getPageXY(e) {
    const rect = page.getBoundingClientRect();
    if (e.touches) {
      return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top,
               cx: e.touches[0].clientX, cy: e.touches[0].clientY };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top, cx: e.clientX, cy: e.clientY };
  }

  canvas.addEventListener('mousemove', e => {
    const { x, y, cx, cy } = getPageXY(e);
    mouseX = cx; mouseY = cy;
    isActive = true;
    reveal(x, y);
  });
  canvas.addEventListener('mouseleave', () => { isActive = false; });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const { x, y } = getPageXY(e);
    isActive = true;
    reveal(x, y);
  }, { passive: false });
  canvas.addEventListener('touchend', () => { isActive = false; });

  window.addEventListener('resize', resize);
  resize();
</script>
</body>
</html>
